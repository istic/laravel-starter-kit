name: "[Dependabot] Make Release"

on:
  schedule:
    - cron: "0 3 * * 1" # Monday 3am UTC
  workflow_dispatch:
    inputs:
      merge_dependabot:
        description: "Merge dependabot-updates into main first"
        required: false
        default: true
        type: boolean
      version_bump:
        description: "Version bump type"
        required: true
        default: "patch"
        type: choice
        options:
          - patch
          - minor
          - major

permissions: {}

jobs:
  check-for-updates:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      has_updates: ${{ steps.check.outputs.has_updates }}
      version_bump: ${{ steps.params.outputs.version_bump }}

    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Resolve parameters
        id: params
        env:
          EVENT_NAME: ${{ github.event_name }}
          INPUT_VERSION_BUMP: ${{ inputs.version_bump }}
        run: |
          if [ "$EVENT_NAME" = "schedule" ]; then
            echo "version_bump=patch" >> "$GITHUB_OUTPUT"
          else
            echo "version_bump=$INPUT_VERSION_BUMP" >> "$GITHUB_OUTPUT"
          fi

      - name: Check if dependabot-updates is ahead of main
        id: check
        run: |
          git fetch origin
          if ! git ls-remote --exit-code origin dependabot-updates > /dev/null 2>&1; then
            echo "dependabot-updates branch does not exist, skipping release"
            echo "has_updates=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          AHEAD=$(git rev-list --count origin/main..origin/dependabot-updates)
          echo "dependabot-updates is $AHEAD commits ahead of main"
          if [ "$AHEAD" -gt 0 ]; then
            echo "has_updates=true" >> "$GITHUB_OUTPUT"
          else
            echo "No new commits in dependabot-updates, skipping release"
            echo "has_updates=false" >> "$GITHUB_OUTPUT"
          fi

  merge-dependabot:
    needs: check-for-updates
    if: |
      needs.check-for-updates.outputs.has_updates == 'true' &&
      (github.event_name == 'schedule' || inputs.merge_dependabot == true)
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
      checks: read

    steps:
      - name: Checkout dependabot-updates
        uses: actions/checkout@v7
        with:
          ref: dependabot-updates
          fetch-depth: 0
          token: ${{ secrets.REBASE_TOKEN }} # pragma: allowlist secret

      - name: Configure git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: "8.4"
          tools: composer:v2
          extensions: opentelemetry

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: "22"

      - name: Merge main into dependabot-updates, regenerating lockfiles on conflict
        run: |
          set -e
          git fetch origin main
          if git merge origin/main --no-edit; then
            echo "Merged main into dependabot-updates cleanly"
            exit 0
          fi

          CONFLICTS=$(git diff --name-only --diff-filter=U)
          echo "Conflicting files:"
          echo "$CONFLICTS"

          if [ -z "$CONFLICTS" ]; then
            echo "::error::Merge failed but no conflicted files were found - not a simple content conflict, needs manual investigation"
            git merge --abort
            exit 1
          fi

          NON_LOCKFILE_CONFLICTS=$(echo "$CONFLICTS" | grep -vE '^(composer\.lock|package-lock\.json)$' || true)
          if [ -n "$NON_LOCKFILE_CONFLICTS" ]; then
            echo "::error::Conflicts outside of composer.lock/package-lock.json need manual resolution:"
            echo "$NON_LOCKFILE_CONFLICTS"
            git merge --abort
            exit 1
          fi

          if echo "$CONFLICTS" | grep -qx 'composer.lock'; then
            echo "Regenerating composer.lock"
            rm -f composer.lock
            composer update --no-interaction --no-scripts
            git add composer.lock
          fi

          if echo "$CONFLICTS" | grep -qx 'package-lock.json'; then
            echo "Regenerating package-lock.json"
            rm -f package-lock.json
            npm install --package-lock-only --ignore-scripts --no-audit --no-fund
            git add package-lock.json
          fi

          git commit --no-edit

      - name: Push resolved dependabot-updates
        run: git push origin dependabot-updates

      - name: Merge dependabot-updates PR into main
        env:
          # github.token cannot merge PRs (see CLAUDE.md); use the same PAT
          # as auto-rebase-dependabot.yml for this class of operation.
          GH_TOKEN: ${{ secrets.REBASE_TOKEN }}
          GH_REPO: ${{ github.repository }}
        run: |
          if ! PR_STATE_RAW=$(gh pr view dependabot-updates --json state --jq '.state' 2>&1); then
            if echo "$PR_STATE_RAW" | grep -qi "no pull requests found"; then
              PR_STATE="NOT_FOUND"
            else
              echo "ERROR: gh pr view failed: $PR_STATE_RAW" >&2
              exit 1
            fi
          else
            PR_STATE="$PR_STATE_RAW"
          fi
          if [ "$PR_STATE" != "OPEN" ]; then
            echo "No open PR for dependabot-updates (state: $PR_STATE), creating one..."
            gh pr create --base main --head dependabot-updates \
              --title "chore: bump dependencies" \
              --body "Automated dependency updates"
          fi
          PR_IS_DRAFT=$(gh pr view dependabot-updates --json isDraft --jq '.isDraft')
          if [ "$PR_IS_DRAFT" = "true" ]; then
            gh pr ready dependabot-updates
          fi
          gh pr checks dependabot-updates --watch --fail-fast
          gh pr merge dependabot-updates --merge

  create-release:
    needs: [check-for-updates, merge-dependabot]
    if: |
      !failure() && !cancelled() &&
      (github.event_name == 'workflow_dispatch' || needs.check-for-updates.outputs.has_updates == 'true')
    permissions:
      contents: write
      packages: write
    uses: ./.github/workflows/release.yml
    with:
      version_bump: ${{ needs.check-for-updates.outputs.version_bump }}
    secrets: inherit # pragma: allowlist secret

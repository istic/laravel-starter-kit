version: 2
updates:
  - package-ecosystem: "composer"
    directory: "/"
    schedule:
      interval: "weekly"
    target-branch: "dependabot-updates"
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
    target-branch: "dependabot-updates"
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    target-branch: "dependabot-updates"

  - package-ecosystem: "docker"
    directories:
      - "/docker/production"
      - "/docker/cloudflared"
    schedule:
      interval: "weekly"
    target-branch: "dependabot-updates"
